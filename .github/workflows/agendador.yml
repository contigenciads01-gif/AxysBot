# Chama o agendador do AXYSBOT no Vercel a cada 5 minutos.
# Sem API paga do X: ele so marca os posts que chegaram na hora e registra o
# lembrete. Publicar e sempre um clique seu, na tela do proprio X.
#
# Sem segredo para cadastrar: o job pede ao GitHub um token OIDC assinado e o
# painel confere a assinatura e que o token veio DESTE repositorio, DESTE
# workflow, na main (src/lib/oidc.ts).
#
# Endereco do app: variavel APP_URL do repositorio (Settings > Secrets and
# variables > Actions > Variables), se existir; senao o padrao abaixo.
name: Agendador

on:
  schedule:
    - cron: "*/5 * * * *"   # avisa posts que chegaram na hora
  workflow_dispatch:

concurrency:
  group: agendador
  cancel-in-progress: false

permissions:
  id-token: write   # so para pedir o token OIDC

jobs:
  chamar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar o AXYSBOT
        env:
          APP_URL: ${{ vars.APP_URL || 'https://axysbotpuro.vercel.app' }}
        run: |
          ROTA=/api/cron/publish
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=axysbot" | jq -r .value)
          [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ] || { echo "::error::Nao consegui o token OIDC"; exit 1; }
          status=$(curl -sS -o resposta.json -w '%{http_code}' --max-time 90 \
            -H "Authorization: Bearer $TOKEN" "$APP_URL$ROTA")
          echo "HTTP $status em $ROTA"
          cat resposta.json; echo
          case "$status" in
            200) ;;
            503) echo "::warning::Painel ainda nao configurado (veja a tela inicial)";;
            *) echo "::error::O AXYSBOT respondeu HTTP $status"; exit 1;;
          esac
